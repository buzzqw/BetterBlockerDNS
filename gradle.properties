org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Retry repository downloads: a short outage or rate limit at Maven Central
# must not fail a build, or an unrelated push (see settings.gradle.kts).
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000

# AGP 9: keep the external Kotlin plugin/KSP setup used by this project.
android.builtInKotlin=false

# AGP 9 migration: keep the existing external Kotlin plugin DSL.
android.newDsl=false
