name: Release

# Pushing a version tag (v1.0.NN) builds the APK signed with the project key
# and publishes the GitHub release. Ordinary commits are only verified by the
# Build workflow. The release email is still sent from the owner's machine
# (scripts/build_release.sh), because the SMTP credentials stay off GitHub.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, for example v1.0.34'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Needed to create the release and upload the signed APK.
      contents: write

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # SHA-256 of the project signing certificate (CN=buzzqw,
      # OU=BetterBlockerDNS). A release signed with any other key is refused.
      EXPECTED_CERT_SHA256: b6de8e179abd20d705d0084af4a6d667c5ce2962aa649758cc2e29f08ccc7eba

    # Third-party actions are pinned to full commit SHAs: this job can publish
    # a signed APK, so a moved tag must not be able to run code in it.
    steps:
      - name: Check out the tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches version.properties
        run: |
          version="$(sed -n 's/^versionName=//p' version.properties | head -n 1)"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match versionName $version in version.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEY_BASE64 }}
          BBDNS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          BBDNS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BBDNS_SKIP_EMAIL: "1"
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$BBDNS_KEYSTORE_PASSWORD" || -z "$BBDNS_KEY_ALIAS" ]]; then
            echo "::error::Signing secrets KEY_BASE64, KEYSTORE_PASS and KEY_ALIAS must be set"
            exit 1
          fi
          # Remove the decoded keystore on success, failure and cancellation.
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          BBDNS_KEYSTORE="$RUNNER_TEMP/release.jks" \
            ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verify the signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          actual="$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is signed with an unexpected certificate ($actual)"
            exit 1
          fi
          cp "$apk" "BetterBlockerDNS-$VERSION.apk"

      - name: Write the release notes from CHANGELOG.md
        run: |
          # The day section that contains "### Release <version>", without its
          # date heading and without the release marker line.
          awk -v rel="### Release $VERSION" '
            /^## / { if (found) exit; block = ""; next }
            { block = block $0 "\n" }
            $0 == rel { found = 1 }
            END { if (found) printf "%s", block }
          ' CHANGELOG.md \
            | awk -v rel="### Release $VERSION" '
                $0 == rel { skip = 1; next }
                skip && /^### / { skip = 0 }
                !skip' > section.md
          {
            echo "## BetterBlockerDNS $VERSION"
            echo
            if [[ -s section.md ]]; then
              cat section.md
            else
              cat "metadata/en-US/changelogs/$(sed -n 's/^versionCode=//p' version.properties).txt"
            fi
          } > notes.md
          cat notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="BetterBlockerDNS-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Rebuilding an existing release replaces its APK and notes.
            gh release upload "$TAG" "$apk" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$apk" \
              --title "BetterBlockerDNS $VERSION" \
              --notes-file notes.md \
              --verify-tag
          fi
