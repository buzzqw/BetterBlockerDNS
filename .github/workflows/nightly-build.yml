name: Nightly Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs so a compromised or
# moved tag cannot execute arbitrary code with this job's contents:write
# permission (which can publish a signed APK).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build F-Droid release APK
        run: ./gradlew assembleFdroidRelease
        env:
          BBDNS_SKIP_EMAIL: "1"
          BBDNS_BUILD_NUMBER: ${{ github.run_number }}

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Remove the decoded keystore on success, failure and cancellation.
          trap 'rm -f "$RUNNER_TEMP/keystore.jks"' EXIT
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out BetterBlockerDNS-nightly.apk \
            app/build/outputs/apk/fdroid/release/app-fdroid-release.apk

      - name: Create release notes
        run: |
          {
            echo "Automated nightly build of BetterBlockerDNS."
            echo
            echo "**Build Info:**"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > nightly-changelog.txt

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BetterBlockerDNS-Nightly
          path: BetterBlockerDNS-nightly.apk

      - name: Publish nightly release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          files: BetterBlockerDNS-nightly.apk
          body_path: nightly-changelog.txt
